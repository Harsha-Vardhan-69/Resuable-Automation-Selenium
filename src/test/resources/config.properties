# default browser: chrome/edge
browser = chrome

# headless true/false
headless = true

# execution ENV used when no terminal override is provided.
env = uat

# default explicit wait settings (used by WaitUtil)
wait.timeout.seconds = 10
wait.poll.millis = 500

# Public website smoke target
hanover.url = https://www.hanover.com

